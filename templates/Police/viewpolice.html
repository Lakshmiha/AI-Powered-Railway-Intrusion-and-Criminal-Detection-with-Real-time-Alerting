<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View police Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 
</head>
<body>
  <div class="container">
    <h2 class="mb-4">View Police Form</h2>
    <form>

        <div class="row mb-3">
        <label for="photo" class="col-sm-4 ">Photo</label>
      </div>

      <div class="row mb-3">
        <label for="name" class="col-sm-4 ">Full Name</label>
      </div>

      <div class="row mb-3">
        <label for="email" class="col-sm-4 ">Email address</label>
      </div>

      <div class="row mb-3">
        <label for="phone" class="col-sm-4 ">Phone Number</label>
      </div>

      <div class="row mb-3">
        <label for="place" class="col-sm-4 ">Place</label>
      </div>

      <div class="row mb-3">
        <label for="city" class="col-sm-4 ">City</label>
      </div>

      <div class="row mb-3">
        <label for="state" class="col-sm-4 ">State</label>
      </div>

      <div class="row mb-3">
        <label for="pincode" class="col-sm-4 ">Pincode</label>
      </div>

      <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit" class="btn btn-primary">edit</button>
        </div>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

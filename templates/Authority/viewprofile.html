<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>add authority Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 
</head>
<body>
{% extends 'Authority/authority_home.html' %}
{% block body %}
  <div class="container">
    <h2 class="mb-4">View Profile</h2>
    <form>

        <div class="row mb-3">
        <label for="photo" class="col-sm-4 ">Photo</label>
            <img src="{{ data.photo }}" style="border-radius: 50%;width: 100px" >
      </div>

      <div class="row mb-3">
        <label for="name" class="col-sm-4 ">Full Name</label>
          {{ data.authorityname }}
      </div>

      <div class="row mb-3">
        <label for="email" class="col-sm-4 ">Email address</label>
          {{ data.email }}
      </div>

      <div class="row mb-3">
        <label for="phone" class="col-sm-4 ">Phone Number</label>
          {{ data.phone }}
      </div>

      <div class="row mb-3">
        <label for="place" class="col-sm-4 ">Place</label>
          {{ data.place }}
      </div>

      <div class="row mb-3">
        <label for="city" class="col-sm-4 ">District</label>
          {{ data.district }}
      </div>

      <div class="row mb-3">
        <label for="state" class="col-sm-4 ">State</label>
          {{ data.state }}
      </div>

      <div class="row mb-3">
        <label for="pincode" class="col-sm-4 ">Pincode</label>
          {{ data.pin }}
      </div>

{#      <div class="row mb-3">#}
{#        <div class="offset-sm-4 col-sm-8">#}
{#          <a href="/myapp/edit_profile_get/" class="btn btn-primary">edit</a>#}
{#        </div>#}
{#      </div>#}
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Criminals Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
{% extends 'Authority/authority_home.html' %}
{% block body %}
  <div class="container">
    <h2 class="mb-4">Edit Criminals Form</h2>
    <form method="post" enctype="multipart/form-data" action="/myapp/edit_criminal_post/">
        {% csrf_token %}
    <input type="hidden" name="id" value="{{ data.id }}">
      <div class="row mb-3">
        <label for="name" class="col-sm-4 ">Full Name</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" value="{{ data.criminalname }}" id="criminalname" name="criminalname" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="photo" class="col-sm-4 ">Photo</label>
        <div class="col-sm-8">
          <input type="file" class="form-control" id="photo" name="photo" accept="image/*" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="identification" class="col-sm-4 ">Identification</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" value="{{ data.identification }}" id="identification" name="identification" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="DOB" class="col-sm-4 ">DOB</label>
        <div class="col-sm-8">
          <input type="date" id="dob" name="dob" value="{{ data.dob }}" required>
        </div>
      </div>

        <div class="row mb-3">
        <label for="" class="col-sm-4 " id="gender">Gender</label>
        <div class="col-sm-8">
          <input type="radio" id="male" {% if data.gender == 'Male' %}checked{% endif %} name="gender" value="Male">Male
            <input type="radio" id="female" {% if data.gender == 'Female' %}checked{% endif %} name="gender" value="Female">Female
            <input type="radio" id="others" {% if data.gender == 'Others' %}checked{% endif %}name="gender" value="Others">Others
        </div>
      </div>

      <div class="row mb-3">
        <label for="offense" class="col-sm-4 ">Offense</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="offense" name="offense" value="{{ data.offense }}" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="weight" class="col-sm-4 ">Weight</label>
        <div class="col-sm-8">
          <input type="text" pattern="[0-9]{2}" class="form-control" id="weight" name="weight" value="{{ data.weight }}" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="height" class="col-sm-4 ">Height</label>
        <div class="col-sm-8">
          <input type="text" pattern="[0-9]{3}" class="form-control" id="height" name="height" value="{{ data.height }}" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="phone" class="col-sm-4 ">Phone no</label>
        <div class="col-sm-8">
          <input type="tel" pattern="[0-9]{10}" class="form-control" id="phoneno" name="phoneno" value="{{ data.phoneno }}" required>
        </div>
      </div>


      <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit" class="btn btn-primary">Edit</button>
        </div>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
{% endblock %}

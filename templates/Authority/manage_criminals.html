<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Criminals Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 
</head>
<body>
  <div class="container">
    <h2 class="mb-4">Add Criminals Form</h2>
    <form method="post" action="/myapp/manage_criminals_post/">
        {% csrf_token %}
      <div class="row mb-3">
        <label for="name" class="col-sm-4 ">Full Name</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="name" name="name" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="photo" class="col-sm-4 ">Photo</label>
        <div class="col-sm-8">
          <input type="file" class="form-control" id="photo" name="photo" accept="image/*" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="identification" class="col-sm-4 ">Identification</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="identification" name="identification" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="DOB" class="col-sm-4 ">DOB</label>
        <div class="col-sm-8">
          <input type="date" id="dob" name="dob" required>
        </div>
      </div>

        <div class="row mb-3">
        <label for="" class="col-sm-4 ">Gender</label>
        <div class="col-sm-8">
          <input type="radio" id="male" name="male" value="Male">Male
            <input type="radio" id="female" name="female" value="Female">Female
            <input type="radio" id="others" name="others" value="Others">Others
        </div>
      </div>

      <div class="row mb-3">
        <label for="offense" class="col-sm-4 ">Offense</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="offense" name="offense" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="weight" class="col-sm-4 ">Weight</label>
        <div class="col-sm-8">
          <input type="text" pattern="[0-9]{6}" class="form-control" id="weight" name="weight" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="height" class="col-sm-4 ">Height</label>
        <div class="col-sm-8">
          <input type="text" pattern="[0-9]{6}" class="form-control" id="height" name="height" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="phone" class="col-sm-4 ">Phone no</label>
        <div class="col-sm-8">
          <input type="tel" pattern="[0-9]{10}" class="form-control" id="phone" name="phone" required>
        </div>
      </div>


      <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit" class="btn btn-primary">Submit</button>
        </div>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

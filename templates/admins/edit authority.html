{% extends 'admins/admin_home.html' %}
{% block body %}
  <div class="container">
    <h2 class="mb-4">Edit authority Form</h2>
    <form method="post" action="/myapp/edit_authority_post/" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="hidden" name="id" value="{{ data.id }}">
      <div class="row mb-3">
        <label for="name" class="col-sm-4 ">Full Name</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="name" value="{{ data.authorityname }}" name="name" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="email" class="col-sm-4 ">Email address</label>
        <div class="col-sm-8">
          <input type="email" class="form-control" id="email" value="{{ data.email }}" name="email" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="phone" class="col-sm-4 ">Phone Number</label>
        <div class="col-sm-8">
          <input type="tel" pattern="[0-9]{10}" class="form-control" value="{{ data.phone }}" id="phone" name="phone" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="place" class="col-sm-4 ">Place</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="place" value="{{ data.place }}" name="place" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="city" class="col-sm-4 ">District</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="district" value="{{ data.district }}" name="district" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="state" class="col-sm-4 ">State</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="state" value="{{ data.state }}" name="state" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="pincode" class="col-sm-4 ">Pincode</label>
        <div class="col-sm-8">
          <input type="text" pattern="[0-9]{6}" class="form-control" id="pincode" value="{{ data.pin }}" name="pincode" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="photo" class="col-sm-4 ">Upload Photo</label>
        <div class="col-sm-8">
          <input type="file" class="form-control" id="photo" name="photo" accept="image/*">
            <img src="{{ data.photo }}" class="img-thumbnail" width="50" />
        </div>
      </div>

      <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit" class="btn btn-primary">Edit</button>
        </div>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{#</body>#}
{#</html>#}{% endblock %}

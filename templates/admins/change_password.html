{% extends 'admins/admin_home.html' %}
{% block body %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="text-center">Change Password</h2>
                <form action="/myapp/change_password_post/" method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="username">Current password</label>
                        <input type="text" class="form-control"  id="currentpassword" placeholder="Enter your current password" name="currentpassword" required>
                    </div>
                    <div class="form-group">
                        <label for="password">New Password</label>
                        <input type="password" class="form-control" id="newpassword" placeholder="Enter your new password" name="newpassword" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmpassword" placeholder="Enter your confirmed password" name="confirmpassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Change</button>
                </form>
                {% for j in messages %}

                    {{ j }}
                {% endfor %}
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
{#</body>#}
{#</html>#}
{% endblock %}
